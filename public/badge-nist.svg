<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 140" width="120" height="140">
  <defs>
    <linearGradient id="nistBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a2a1a"/>
      <stop offset="100%" style="stop-color:#0f1f0f"/>
    </linearGradient>
  </defs>

  <!-- Badge body -->
  <rect x="4" y="4" width="112" height="132" rx="10" ry="10" fill="url(#nistBg)" stroke="#2d5c2d" stroke-width="1.5"/>

  <!-- Framework grid icon -->
  <g transform="translate(60, 40)">
    <!-- 3x3 grid of squares representing a framework -->
    <rect x="-18" y="-18" width="10" height="10" rx="2" fill="#4ade80" opacity="0.9"/>
    <rect x="-5" y="-18" width="10" height="10" rx="2" fill="#4ade80" opacity="0.7"/>
    <rect x="8" y="-18" width="10" height="10" rx="2" fill="#4ade80" opacity="0.5"/>
    <rect x="-18" y="-5" width="10" height="10" rx="2" fill="#4ade80" opacity="0.7"/>
    <rect x="-5" y="-5" width="10" height="10" rx="2" fill="#4ade80" opacity="0.9"/>
    <rect x="8" y="-5" width="10" height="10" rx="2" fill="#4ade80" opacity="0.7"/>
    <rect x="-18" y="8" width="10" height="10" rx="2" fill="#4ade80" opacity="0.5"/>
    <rect x="-5" y="8" width="10" height="10" rx="2" fill="#4ade80" opacity="0.7"/>
    <rect x="8" y="8" width="10" height="10" rx="2" fill="#4ade80" opacity="0.9"/>
  </g>

  <!-- Divider -->
  <line x1="20" y1="68" x2="100" y2="68" stroke="#2d5c2d" stroke-width="1"/>

  <!-- NIST text -->
  <text x="60" y="92" text-anchor="middle" font-family="'Arial', sans-serif" font-weight="900" font-size="26" letter-spacing="1" fill="#ffffff">NIST</text>

  <!-- CSF ALIGNED label -->
  <rect x="18" y="102" width="84" height="20" rx="4" fill="#1a3d1a"/>
  <text x="60" y="116" text-anchor="middle" font-family="'Arial', sans-serif" font-weight="700" font-size="10" letter-spacing="2" fill="#86efac">CSF ALIGNED</text>
</svg>
