<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 140" width="120" height="140">
  <defs>
    <linearGradient id="soc2Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2a1f0a"/>
      <stop offset="100%" style="stop-color:#1a1305"/>
    </linearGradient>
  </defs>

  <!-- Badge body -->
  <rect x="4" y="4" width="112" height="132" rx="10" ry="10" fill="url(#soc2Bg)" stroke="#6b4c10" stroke-width="1.5"/>

  <!-- Clock / in-progress icon -->
  <g transform="translate(60, 40)">
    <circle cx="0" cy="0" r="20" fill="none" stroke="#f59e0b" stroke-width="2" opacity="0.4"/>
    <!-- Progress arc (about 75%) -->
    <path d="M 0 -20 A 20 20 0 1 1 -14.1 14.1" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Clock hands -->
    <line x1="0" y1="0" x2="0" y2="-12" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="9" y2="6" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="2" fill="#f59e0b"/>
  </g>

  <!-- Divider -->
  <line x1="20" y1="68" x2="100" y2="68" stroke="#6b4c10" stroke-width="1"/>

  <!-- SOC 2 text -->
  <text x="60" y="92" text-anchor="middle" font-family="'Arial', sans-serif" font-weight="900" font-size="26" letter-spacing="1" fill="#ffffff">SOC 2</text>

  <!-- IN PROGRESS label -->
  <rect x="18" y="102" width="84" height="20" rx="4" fill="#3d2a00"/>
  <text x="60" y="116" text-anchor="middle" font-family="'Arial', sans-serif" font-weight="700" font-size="10" letter-spacing="2" fill="#fcd34d">IN PROGRESS</text>
</svg>
