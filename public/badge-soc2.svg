<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 150" width="120" height="150">
  <defs>
    <linearGradient id="soc2Bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a5f"/>
      <stop offset="100%" style="stop-color:#0f2240"/>
    </linearGradient>
    <linearGradient id="soc2Header" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#c8973a"/>
      <stop offset="100%" style="stop-color:#a87828"/>
    </linearGradient>
  </defs>

  <!-- Shield shape: flat top, angled sides, pointed bottom -->
  <path d="M10,8 H110 Q116,8 116,14 V90 Q116,120 60,145 Q4,120 4,90 V14 Q4,8 10,8 Z"
        fill="url(#soc2Bg)" stroke="#2d5299" stroke-width="1.5"/>

  <!-- Gold header band -->
  <path d="M4,14 Q4,8 10,8 H110 Q116,8 116,14 V38 H4 Z"
        fill="url(#soc2Header)"/>

  <!-- "SOC" in header -->
  <text x="60" y="30" text-anchor="middle"
        font-family="'Arial Black', 'Arial', sans-serif"
        font-weight="900" font-size="20" letter-spacing="4"
        fill="#ffffff">SOC</text>

  <!-- Large "2" -->
  <text x="60" y="82" text-anchor="middle"
        font-family="'Arial Black', 'Arial', sans-serif"
        font-weight="900" font-size="46"
        fill="#ffffff">2</text>

  <!-- Thin divider line -->
  <line x1="24" y1="92" x2="96" y2="92" stroke="#2d5299" stroke-width="1"/>

  <!-- "TYPE II" sub-label (greyed, industry-standard positioning) -->
  <text x="60" y="107" text-anchor="middle"
        font-family="'Arial', sans-serif"
        font-weight="600" font-size="9" letter-spacing="2.5"
        fill="#7aa3d4">TYPE II</text>

  <!-- "IN PROGRESS" status band near bottom of shield -->
  <rect x="20" y="114" width="80" height="18" rx="3"
        fill="#c8973a" opacity="0.25"/>
  <text x="60" y="127" text-anchor="middle"
        font-family="'Arial', sans-serif"
        font-weight="700" font-size="9" letter-spacing="2"
        fill="#f0c060">IN PROGRESS</text>
</svg>
