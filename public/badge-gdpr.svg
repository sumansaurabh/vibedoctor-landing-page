<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 140" width="120" height="140">
  <defs>
    <linearGradient id="gdprBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a3a6b"/>
      <stop offset="100%" style="stop-color:#0d2347"/>
    </linearGradient>
  </defs>

  <!-- Badge body -->
  <rect x="4" y="4" width="112" height="132" rx="10" ry="10" fill="url(#gdprBg)" stroke="#2d5299" stroke-width="1.5"/>

  <!-- EU circle of stars -->
  <g transform="translate(60, 38)">
    <circle cx="0" cy="-16" r="2.5" fill="#FFD700"/>
    <circle cx="8" cy="-13.9" r="2.5" fill="#FFD700"/>
    <circle cx="13.1" cy="-6.8" r="2.5" fill="#FFD700"/>
    <circle cx="13.1" cy="1.4" r="2.5" fill="#FFD700"/>
    <circle cx="8" cy="8.5" r="2.5" fill="#FFD700"/>
    <circle cx="0" cy="10.6" r="2.5" fill="#FFD700"/>
    <circle cx="-8" cy="8.5" r="2.5" fill="#FFD700"/>
    <circle cx="-13.1" cy="1.4" r="2.5" fill="#FFD700"/>
    <circle cx="-13.1" cy="-6.8" r="2.5" fill="#FFD700"/>
    <circle cx="-8" cy="-13.9" r="2.5" fill="#FFD700"/>
    <circle cx="-4.9" cy="-15.2" r="2.5" fill="#FFD700"/>
    <circle cx="4.9" cy="-15.2" r="2.5" fill="#FFD700"/>
  </g>

  <!-- Divider -->
  <line x1="20" y1="68" x2="100" y2="68" stroke="#2d5299" stroke-width="1"/>

  <!-- GDPR text -->
  <text x="60" y="92" text-anchor="middle" font-family="'Arial', sans-serif" font-weight="900" font-size="26" letter-spacing="1" fill="#ffffff">GDPR</text>

  <!-- COMPLIANT label -->
  <rect x="18" y="102" width="84" height="20" rx="4" fill="#2d5299"/>
  <text x="60" y="116" text-anchor="middle" font-family="'Arial', sans-serif" font-weight="700" font-size="10" letter-spacing="2" fill="#a8c4f0">COMPLIANT</text>
</svg>
